<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance | GP Daman</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background glowing orbs for Glassmorphism effect -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="glass-card">
            <div class="header">
                <!-- Using placeholder for the logo you uploaded -->
                <img src="logo.png" alt="GP Daman Logo" class="logo" onerror="this.style.display='none'">
                <h1>Government Polytechnic, Daman</h1>
                <p class="subtitle">AI-Based Smart Attendance System</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('attendance')">Mark Attendance</button>
                <button class="tab-btn" onclick="switchTab('register')">Register Face</button>
            </div>

            <!-- Attendance Section -->
            <div id="attendance-section" class="tab-content active">
                <div class="input-group">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="att-enrollment" placeholder="Enter Enrollment No." autocomplete="off">
                </div>
                
                <div class="input-group">
                    <i class="fa-solid fa-qrcode"></i>
                    <input type="text" id="att-qr" placeholder="Enter Class QR Token" autocomplete="off">
                </div>

                <div class="camera-container">
                    <video id="att-video" autoplay playsinline></video>
                    <div class="camera-overlay"></div>
                </div>

                <button class="primary-btn" onclick="markAttendance()">
                    <i class="fa-solid fa-expand"></i> Scan & Mark Attendance
                </button>
                <p id="att-status" class="status-msg"></p>
            </div>

            <!-- Registration Section -->
            <div id="register-section" class="tab-content">
                <div class="input-group">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="reg-enrollment" placeholder="Enter Enrollment No." autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="reg-name" placeholder="Enter Full Name" autocomplete="off">
                </div>

                <div class="camera-container">
                    <video id="reg-video" autoplay playsinline></video>
                    <div class="camera-overlay"></div>
                </div>

                <button class="primary-btn" onclick="registerStudent()">
                    <i class="fa-solid fa-user-plus"></i> Register Student Face
                </button>
                <p id="reg-status" class="status-msg"></p>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for capturing image from video -->
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="app.js"></script>
</body>
</html>
