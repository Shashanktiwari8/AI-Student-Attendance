<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance | GP Daman</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html5-qrcode library for camera QR code scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <!-- Background glowing orbs for Glassmorphism effect -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="container">
        <div class="glass-card">
            <div class="header">
                <img src="logo.png" alt="GP Daman Logo" class="logo" onerror="this.style.display='none'">
                <h1>Government Polytechnic, Daman</h1>
                <p class="subtitle">AI-Based Smart Attendance System</p>
                <div style="margin-top: 10px;">
                    <a href="teacher.html" style="color: #60a5fa; font-size: 0.85rem; text-decoration: none;">
                        <i class="fa-solid fa-chalkboard-user"></i> Open Teacher Dashboard (Projector Mode)
                    </a>
                </div>
            </div>

            <!-- Tab Switching Buttons -->
            <div class="tabs">
                <button id="tab-att-btn" class="tab-btn active" onclick="switchTab('attendance')">
                    <i class="fa-solid fa-user-check"></i> Mark Attendance
                </button>
                <button id="tab-reg-btn" class="tab-btn" onclick="switchTab('register')">
                    <i class="fa-solid fa-user-plus"></i> Register Face
                </button>
            </div>

            <!-- Attendance Section -->
            <div id="attendance-section" class="tab-content active">
                <div class="input-group">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="att-enrollment" placeholder="Enter Enrollment No." autocomplete="off">
                </div>

                <!-- QR Token Input with Camera Scan Button -->
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <div class="input-group" style="margin-bottom: 0; flex: 1;">
                        <i class="fa-solid fa-qrcode"></i>
                        <input type="text" id="att-qr" placeholder="Enter or Scan QR Token" autocomplete="off">
                    </div>
                    <button type="button" class="primary-btn" style="width: auto; padding: 0 16px; margin: 0; background: #2563eb; font-size: 0.85rem;" onclick="toggleQRScanner()">
                        <i class="fa-solid fa-camera"></i> Scan QR
                    </button>
                </div>

                <!-- Optional QR Scanner Pop-down Window -->
                <div id="qr-scanner-box" style="display: none; background: rgba(0,0,0,0.4); border-radius: 14px; padding: 12px; margin-bottom: 15px; border: 1px solid #60a5fa;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-size: 0.85rem; color: #60a5fa; font-weight: 600;">Point camera at Projector QR:</span>
                        <button type="button" onclick="closeQRScanner()" style="background: none; border: none; color: #ef4444; font-size: 1rem; cursor: pointer;">
                            <i class="fa-solid fa-xmark"></i> Close
                        </button>
                    </div>
                    <div id="qr-reader" style="width: 100%; border-radius: 8px; overflow: hidden;"></div>
                </div>

                <!-- Front Selfie Camera -->
                <div class="camera-container">
                    <video id="att-video" autoplay playsinline></video>
                    <div class="camera-overlay"></div>
                </div>

                <button class="primary-btn" onclick="markAttendance()">
                    <i class="fa-solid fa-check-circle"></i> Verify Selfie & Mark Attendance
                </button>
                <p id="att-status" class="status-msg"></p>
            </div>

            <!-- Registration Section -->
            <div id="register-section" class="tab-content">
                <div class="input-group">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="reg-enrollment" placeholder="Enter Enrollment No." autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="reg-name" placeholder="Enter Full Name" autocomplete="off">
                </div>

                <div class="camera-container">
                    <video id="reg-video" autoplay playsinline></video>
                    <div class="camera-overlay"></div>
                </div>

                <button class="primary-btn" onclick="registerStudent()">
                    <i class="fa-solid fa-user-plus"></i> Capture & Register Student Face
                </button>
                <p id="reg-status" class="status-msg"></p>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for capturing image from video -->
    <canvas id="canvas" style="display:none;"></canvas>

    <script src="app.js?v=9"></script>
</body>
</html>
